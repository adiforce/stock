<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票聊天室</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e2a;
    --border: #252a38;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --green: #3dd68c;
    --red: #f75f5f;
    --yellow: #f7c948;
    --text: #e2e6f0;
    --text2: #7a8299;
    --text3: #4a5068;
    --bubble-user: #1e2540;
    --bubble-bot: #161a24;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ── 側欄 ── */
  #sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width .3s;
  }

  #sidebar-header {
    padding: 20px 16px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #sidebar-header .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
  }

  #sidebar-header .logo span { color: var(--accent2); }

  #pinned-label, #history-label {
    padding: 12px 16px 6px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text3);
    text-transform: uppercase;
  }

  #pinned-list, #history-list {
    list-style: none;
    padding: 0 8px;
    overflow-y: auto;
  }

  #history-list { flex: 1; overflow-y: auto; }

  .stock-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s;
    gap: 8px;
    margin-bottom: 2px;
  }
  .stock-item:hover { background: var(--bg3); }

  .stock-item .left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

  .stock-item .avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .stock-item .info { min-width: 0; }
  .stock-item .name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stock-item .code { font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace; }

  .stock-item .price-tag {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    flex-shrink: 0;
  }
  .stock-item .price-tag.up { color: var(--green); }
  .stock-item .price-tag.down { color: var(--red); }
  .stock-item .price-tag.flat { color: var(--text2); }

  .item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .stock-item:hover .item-actions { opacity: 1; }

  .item-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 14px; padding: 2px 4px;
    border-radius: 6px; transition: color .15s, background .15s;
  }
  .item-btn:hover { color: var(--text); background: var(--border); }
  .item-btn.pin-active { color: var(--yellow); }

  /* ── 主畫面 ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #topbar {
    height: 56px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
  }

  #topbar .market-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text2);
  }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s infinite;
  }
  .status-dot.closed { background: var(--text3); box-shadow: none; animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  #topbar .spacer { flex: 1; }

  #topbar .clear-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text2); padding: 5px 12px; border-radius: 8px;
    font-size: 12px; cursor: pointer; transition: all .15s;
    font-family: 'Noto Sans TC', sans-serif;
  }
  #topbar .clear-btn:hover { border-color: var(--red); color: var(--red); }

  /* ── 訊息區 ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-row {
    display: flex;
    gap: 10px;
    animation: fadeUp .3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; margin-top: 2px;
    background: var(--bg3);
  }
  .msg-row.user .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    font-size: 13px; font-weight: 700; color: #fff;
    font-family: 'JetBrains Mono', monospace;
  }

  .msg-bubble {
    max-width: 640px;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.7;
  }
  .msg-row.user .msg-bubble {
    background: var(--bubble-user);
    border-color: #2a3050;
  }

  .msg-time {
    font-size: 11px; color: var(--text3);
    margin-top: 4px; padding: 0 4px;
    text-align: right;
  }
  .msg-row.bot .msg-time { text-align: left; }

  /* ── 分析卡片 ── */
  .card-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }

  .card-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--text2);
    background: var(--bg3); padding: 2px 8px; border-radius: 6px;
  }

  .card-name { font-size: 17px; font-weight: 700; }

  .price-row {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 16px; flex-wrap: wrap;
  }

  .price-main {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px; font-weight: 600;
  }

  .price-change {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 600;
  }
  .price-change.up { color: var(--green); }
  .price-change.down { color: var(--red); }
  .price-change.flat { color: var(--text2); }

  .price-prev {
    font-size: 12px; color: var(--text2);
  }

  .score-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }

  .score-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px; font-weight: 700;
    color: var(--accent);
  }

  .score-label { font-size: 13px; color: var(--text2); }

  .score-track {
    flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
  }

  .score-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 1s cubic-bezier(.4,0,.2,1);
  }

  .verdict {
    display: inline-block;
    padding: 3px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 500;
    margin-bottom: 16px;
  }
  .verdict.buy { background: rgba(61,214,140,.15); color: var(--green); border: 1px solid rgba(61,214,140,.3); }
  .verdict.watch { background: rgba(247,201,72,.15); color: var(--yellow); border: 1px solid rgba(247,201,72,.3); }
  .verdict.pass { background: rgba(247,95,95,.15); color: var(--red); border: 1px solid rgba(247,95,95,.3); }

  .score-table {
    width: 100%; border-collapse: collapse; margin-bottom: 14px;
  }

  .score-table tr { border-bottom: 1px solid var(--border); }
  .score-table tr:last-child { border-bottom: none; }

  .score-table td {
    padding: 8px 6px; font-size: 13px; vertical-align: top;
  }

  .score-table td:first-child { width: 20px; }
  .score-table td:nth-child(2) { width: 80px; color: var(--text2); }
  .score-table td:nth-child(3) { color: var(--text); }

  .tag {
    display: inline-block; font-size: 11px;
    padding: 1px 7px; border-radius: 4px; margin-right: 4px;
  }
  .tag.pe { background: rgba(79,142,247,.15); color: var(--accent); }
  .tag.div { background: rgba(124,92,252,.15); color: var(--accent2); }

  .simple-note {
    background: var(--bg3); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; color: var(--text2);
    border-left: 3px solid var(--accent);
    margin-bottom: 10px;
  }

  .copy-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text2); padding: 5px 12px; border-radius: 8px;
    font-size: 12px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all .15s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

  .prev-compare {
    font-size: 12px; color: var(--text2);
    background: var(--bg3); border-radius: 8px;
    padding: 6px 12px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── 輸入區 ── */
  #input-area {
    padding: 12px 20px 16px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
  }

  #input-wrap {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 12px;
    transition: border-color .2s;
  }
  #input-wrap:focus-within { border-color: var(--accent); }

  #stock-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    caret-color: var(--accent);
  }
  #stock-input::placeholder { color: var(--text3); }

  #send-btn {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity .15s, transform .1s;
    flex-shrink: 0;
  }
  #send-btn:hover { opacity: .85; }
  #send-btn:active { transform: scale(.95); }
  #send-btn svg { width: 16px; height: 16px; fill: #fff; }

  #hint { font-size: 11px; color: var(--text3); text-align: center; margin-top: 8px; }

  /* ── 空狀態 ── */
  #empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--text3);
  }
  #empty-state .big { font-size: 48px; }
  #empty-state p { font-size: 14px; }

  /* ── loading ── */
  .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text3);
    animation: dot-bounce .9s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot-bounce {
    0%, 100% { transform: translateY(0); opacity: .4; }
    50% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── 錯誤 ── */
  .error-bubble { color: var(--red); font-size: 13px; }

  /* ── RWD ── */
  @media (max-width: 600px) {
    #sidebar { display: none; }
    .price-main { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- 側欄 -->
<div id="sidebar">
  <div id="sidebar-header">
    <div class="logo">ST<span>OCK</span></div>
    <span style="font-size:12px;color:var(--text2);">聊天室</span>
  </div>
  <div id="pinned-label">📌 釘選</div>
  <ul id="pinned-list"></ul>
  <div id="history-label">🕐 最近查詢</div>
  <ul id="history-list"></ul>
</div>

<!-- 主畫面 -->
<div id="main">
  <div id="topbar">
    <div class="market-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="market-status-text">載入中...</span>
    </div>
    <div class="spacer"></div>
    <button class="clear-btn" onclick="clearChat()">清除對話</button>
  </div>

  <div id="messages">
    <div id="empty-state">
      <div class="big">📈</div>
      <p>輸入股票代號或名稱開始查詢</p>
      <p style="font-size:12px;">例：2330、台積電、2542</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <input id="stock-input" type="text" placeholder="輸入股票代號（如 2330）…" autocomplete="off" />
      <button id="send-btn" onclick="handleSearch()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div id="hint">資料來源：TWSE 官方 API｜收盤後更新</div>
  </div>
</div>

<script>
// ── 常數 ──
const PROXY = 'https://api.allorigins.win/raw?url=';
const TWSE_DAY = 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL';
const TWSE_PB  = 'https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL';

let allStocks = [];   // 快取
let pbData    = {};   // 本益比快取

// ── 市場狀態 ──
function updateMarketStatus() {
  const now = new Date();
  const day = now.getDay();
  const h = now.getHours(), m = now.getMinutes();
  const mins = h * 60 + m;
  const dot  = document.getElementById('status-dot');
  const txt  = document.getElementById('market-status-text');
  const isWeekday = day >= 1 && day <= 5;
  const isOpen = isWeekday && mins >= 9*60 && mins < 13*60+30;
  if (isOpen) {
    dot.className = 'status-dot';
    txt.textContent = '交易中';
  } else {
    dot.className = 'status-dot closed';
    txt.textContent = isWeekday ? (mins < 9*60 ? '未開盤' : '已收盤') : '休市';
  }
}
updateMarketStatus();
setInterval(updateMarketStatus, 30000);

// ── 載入 TWSE 資料 ──
async function loadTWSE() {
  if (allStocks.length > 0) return;
  try {
    const [r1, r2] = await Promise.all([
      fetch(PROXY + encodeURIComponent(TWSE_DAY)).then(r => r.json()),
      fetch(PROXY + encodeURIComponent(TWSE_PB)).then(r => r.json())
    ]);
    allStocks = r1;
    r2.forEach(s => { pbData[s.Code] = s; });
  } catch(e) {
    console.warn('TWSE API 錯誤', e);
  }
}

// ── 搜尋股票 ──
function findStock(query) {
  query = query.trim();
  return allStocks.find(s =>
    s.Code === query || s.Name.includes(query)
  );
}

// ── 名稱縮短（顯示完整，不遮蔽） ──
function shortName(name) {
  return name.length > 4 ? name.slice(0,2) + '…' + name.slice(-1) : name;
}

// ── 評分邏輯 ──
function calcScore(stock, pb) {
  const items = [];
  let total = 0;

  // 1. 漲跌
  const change = parseFloat(stock.Change) || 0;
  const close  = parseFloat(stock.ClosingPrice) || 0;
  const changePct = close > 0 ? (change / (close - change) * 100) : 0;
  let s1 = 0, e1 = '';
  if (changePct > 1)       { s1 = 15; e1 = '✅'; }
  else if (changePct > -1) { s1 = 8;  e1 = '⚠️'; }
  else                     { s1 = 2;  e1 = '❌'; }
  items.push({ icon: e1, label: '今日走勢', desc: `${change >= 0 ? '+' : ''}${change} (${changePct.toFixed(2)}%)` });
  total += s1;

  // 2. 本益比
  let s2 = 0, e2 = '';
  const peVal = pb ? parseFloat(pb.PEratio) : null;
  if (peVal && peVal > 0 && peVal < 15)        { s2 = 20; e2 = '✅'; }
  else if (peVal && peVal >= 15 && peVal < 25) { s2 = 12; e2 = '⚠️'; }
  else if (peVal && peVal >= 25)               { s2 = 4;  e2 = '❌'; }
  else                                          { s2 = 10; e2 = '⚠️'; }
  items.push({ icon: e2, label: '本益比', desc: peVal ? `${peVal} 倍` : '無資料' });
  total += s2;

  // 3. 殖利率
  let s3 = 0, e3 = '';
  const divYield = pb ? parseFloat(pb.DividendYield) : null;
  if (divYield && divYield >= 4)        { s3 = 20; e3 = '✅'; }
  else if (divYield && divYield >= 2)   { s3 = 12; e3 = '⚠️'; }
  else if (divYield && divYield > 0)    { s3 = 6;  e3 = '❌'; }
  else                                   { s3 = 8;  e3 = '⚠️'; }
  items.push({ icon: e3, label: '殖利率', desc: divYield ? `${divYield}%` : '無資料' });
  total += s3;

  // 4. 股價淨值比
  let s4 = 0, e4 = '';
  const pbr = pb ? parseFloat(pb.PBratio) : null;
  if (pbr && pbr < 1.5)       { s4 = 20; e4 = '✅'; }
  else if (pbr && pbr < 3)    { s4 = 12; e4 = '⚠️'; }
  else if (pbr && pbr >= 3)   { s4 = 4;  e4 = '❌'; }
  else                         { s4 = 10; e4 = '⚠️'; }
  items.push({ icon: e4, label: '股價淨值比', desc: pbr ? `${pbr} 倍` : '無資料' });
  total += s4;

  // 5. 成交量
  let s5 = 0, e5 = '';
  const vol = parseInt(stock.TradeVolume?.replace(/,/g,'')) || 0;
  if (vol > 5000)       { s5 = 25; e5 = '✅'; }
  else if (vol > 1000)  { s5 = 15; e5 = '⚠️'; }
  else                  { s5 = 5;  e5 = '❌'; }
  items.push({ icon: e5, label: '成交量', desc: `${vol.toLocaleString()} 張` });
  total += s5;

  let verdict = total >= 70 ? 'buy' : total >= 50 ? 'watch' : 'pass';
  let verdictText = total >= 70 ? '積極考慮' : total >= 50 ? '持續觀察' : '暫不進場';

  return { items, total, verdict, verdictText };
}

// ── 比對上次查詢 ──
function getPrevRecord(code) {
  const history = JSON.parse(localStorage.getItem('stockHistory') || '[]');
  return history.filter(h => h.code === code).slice(0, 2);
}

// ── 儲存到 localStorage ──
function saveRecord(code, name, close, change, score) {
  const history = JSON.parse(localStorage.getItem('stockHistory') || '[]');
  history.unshift({ code, name, close, change, score, time: new Date().toISOString() });
  // 去重（保留最新，舊的留最多5筆比對）
  const cleaned = [];
  const seen = {};
  history.forEach(h => {
    if (!seen[h.code]) seen[h.code] = 0;
    if (seen[h.code] < 5) { cleaned.push(h); seen[h.code]++; }
  });
  localStorage.setItem('stockHistory', JSON.stringify(cleaned.slice(0, 100)));
  renderSidebar();
}

// ── 渲染側欄 ──
function renderSidebar() {
  const history = JSON.parse(localStorage.getItem('stockHistory') || '[]');
  const pinned  = JSON.parse(localStorage.getItem('stockPinned')  || '[]');

  const seen = {};
  const unique = history.filter(h => {
    if (seen[h.code]) return false;
    seen[h.code] = true; return true;
  });

  const pinnedStocks  = unique.filter(h => pinned.includes(h.code));
  const historyStocks = unique.filter(h => !pinned.includes(h.code));

  renderList('pinned-list',  pinnedStocks,  pinned);
  renderList('history-list', historyStocks, pinned);
}

function renderList(id, stocks, pinned) {
  const ul = document.getElementById(id);
  ul.innerHTML = '';
  if (stocks.length === 0) {
    ul.innerHTML = `<li style="padding:8px 12px;font-size:12px;color:var(--text3);">無記錄</li>`;
    return;
  }
  stocks.forEach(h => {
    const isPinned = pinned.includes(h.code);
    const chg = parseFloat(h.change) || 0;
    const cls = chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat';
    const sym = chg > 0 ? '▲' : chg < 0 ? '▼' : '─';
    const li = document.createElement('li');
    li.className = 'stock-item';
    li.innerHTML = `
      <div class="left" onclick="quickSearch('${h.code}')">
        <div class="avatar">${h.code.slice(-2)}</div>
        <div class="info">
          <div class="name">${h.name}</div>
          <div class="code">${h.code}</div>
        </div>
      </div>
      <div class="price-tag ${cls}">${sym} ${h.close}</div>
      <div class="item-actions">
        <button class="item-btn ${isPinned ? 'pin-active' : ''}" title="釘選" onclick="togglePin('${h.code}')">📌</button>
        <button class="item-btn" title="刪除" onclick="deleteItem('${h.code}')">✕</button>
      </div>
    `;
    ul.appendChild(li);
  });
}

function quickSearch(code) {
  document.getElementById('stock-input').value = code;
  handleSearch();
}

function togglePin(code) {
  const pinned = JSON.parse(localStorage.getItem('stockPinned') || '[]');
  const idx = pinned.indexOf(code);
  if (idx >= 0) pinned.splice(idx, 1); else pinned.push(code);
  localStorage.setItem('stockPinned', JSON.stringify(pinned));
  renderSidebar();
}

function deleteItem(code) {
  const history = JSON.parse(localStorage.getItem('stockHistory') || '[]');
  const newH = history.filter(h => h.code !== code);
  localStorage.setItem('stockHistory', JSON.stringify(newH));
  const pinned = JSON.parse(localStorage.getItem('stockPinned') || '[]');
  localStorage.setItem('stockPinned', JSON.stringify(pinned.filter(p => p !== code)));
  renderSidebar();
}

// ── 訊息泡泡 ──
function addUserMsg(text) {
  const el = document.getElementById('empty-state');
  if (el) el.remove();
  const msgs = document.getElementById('messages');
  const now = new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
  const div = document.createElement('div');
  div.className = 'msg-row user';
  div.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:flex-end">
      <div class="msg-bubble">${text}</div>
      <div class="msg-time">${now}</div>
    </div>
    <div class="msg-avatar">你</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addLoadingMsg() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg-row bot';
  div.id = 'loading-msg';
  div.innerHTML = `
    <div class="msg-avatar">📊</div>
    <div class="msg-bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function removeLoading() {
  const el = document.getElementById('loading-msg');
  if (el) el.remove();
}

function addErrorMsg(text) {
  removeLoading();
  const msgs = document.getElementById('messages');
  const now = new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
  const div = document.createElement('div');
  div.className = 'msg-row bot';
  div.innerHTML = `
    <div class="msg-avatar">📊</div>
    <div style="display:flex;flex-direction:column">
      <div class="msg-bubble error-bubble">⚠️ ${text}</div>
      <div class="msg-time">${now}</div>
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addAnalysisMsg(stock, pb, score, prevRecords) {
  removeLoading();
  const msgs = document.getElementById('messages');
  const now  = new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
  const close  = parseFloat(stock.ClosingPrice) || 0;
  const change = parseFloat(stock.Change) || 0;
  const prev   = close - change;
  const chgPct = prev > 0 ? (change / prev * 100).toFixed(2) : '0.00';
  const chgCls = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
  const chgSym = change > 0 ? '▲' : change < 0 ? '▼' : '─';
  const peVal  = pb ? pb.PEratio : '─';
  const divVal = pb ? pb.DividendYield + '%' : '─';

  // 上次比對
  let prevHtml = '';
  if (prevRecords.length >= 1) {
    const last = prevRecords[0];
    const diff = (close - parseFloat(last.close)).toFixed(2);
    const diffSym = diff > 0 ? '▲' : diff < 0 ? '▼' : '─';
    const diffCls = diff > 0 ? 'color:var(--green)' : diff < 0 ? 'color:var(--red)' : 'color:var(--text2)';
    prevHtml = `
      <div class="prev-compare">
        🔄 上次查詢 ${last.close} → 現在 ${close}
        <span style="${diffCls};font-weight:600">${diffSym} ${Math.abs(diff)}</span>
      </div>
    `;
  }

  const rowsHtml = score.items.map(it => `
    <tr>
      <td>${it.icon}</td>
      <td>${it.label}</td>
      <td>${it.desc}</td>
    </tr>
  `).join('');

  // 簡單白話結論
  const simpleNote = score.verdict === 'buy'
    ? `本益比和殖利率條件不錯，今日表現穩，可以考慮關注。`
    : score.verdict === 'watch'
    ? `部分指標中性，建議觀望，等更明確訊號再決定。`
    : `目前指標偏弱，建議先觀察，不急著進場。`;

  // 複製內容
  const copyText = `【${stock.Name}（${stock.Code}）】
收盤：${close}　${chgSym}${change}（${chgPct}%）　前日：${prev.toFixed(2)}
本益比：${peVal}　殖利率：${divVal}
評分：${score.total}/100　${score.verdictText}
${score.items.map(it => `${it.icon} ${it.label}：${it.desc}`).join('\n')}
💬 ${simpleNote}`;

  const div = document.createElement('div');
  div.className = 'msg-row bot';
  div.innerHTML = `
    <div class="msg-avatar">📊</div>
    <div style="display:flex;flex-direction:column;flex:1;min-width:0">
      <div class="msg-bubble">
        <div class="card-header">
          <span class="card-code">${stock.Code}</span>
          <span class="card-name">${stock.Name}</span>
          <span class="tag pe">上市</span>
          ${pb && pb.DividendYield > 0 ? `<span class="tag div">配息</span>` : ''}
        </div>
        ${prevHtml}
        <div class="price-row">
          <span class="price-main">${close}</span>
          <span class="price-change ${chgCls}">${chgSym} ${change} (${chgPct}%)</span>
          <span class="price-prev">前日 ${prev.toFixed(2)}</span>
        </div>
        <div class="score-bar">
          <div>
            <div class="score-num">${score.total}</div>
            <div class="score-label">/ 100</div>
          </div>
          <div style="flex:1">
            <div class="score-track"><div class="score-fill" style="width:${score.total}%"></div></div>
            <div style="margin-top:6px">
              <span class="verdict ${score.verdict}">${score.verdictText}</span>
            </div>
          </div>
        </div>
        <table class="score-table">${rowsHtml}</table>
        <div class="simple-note">💬 ${simpleNote}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="copy-btn" onclick="copyText(this, \`${copyText.replace(/`/g,"'")}\`)">📋 複製分析</button>
          <button class="copy-btn" onclick="quickSearch('${stock.Code}')">🔄 重新查詢</button>
        </div>
      </div>
      <div class="msg-time">${now}　資料時間：${stock.Date || '─'}</div>
    </div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ 已複製';
    setTimeout(() => btn.textContent = '📋 複製分析', 2000);
  });
}

// ── 主流程 ──
async function handleSearch() {
  const input = document.getElementById('stock-input');
  const query = input.value.trim();
  if (!query) return;
  input.value = '';

  addUserMsg(query);
  const loading = addLoadingMsg();

  await loadTWSE();

  if (allStocks.length === 0) {
    addErrorMsg('無法連接 TWSE API，請稍後再試。');
    return;
  }

  const stock = findStock(query);
  if (!stock) {
    addErrorMsg(`找不到「${query}」，請確認代號或名稱。目前僅支援上市股（TSE）。`);
    return;
  }

  const pb = pbData[stock.Code] || null;
  const score = calcScore(stock, pb);
  const prevRecords = getPrevRecord(stock.Code);

  saveRecord(stock.Code, stock.Name,
    parseFloat(stock.ClosingPrice) || 0,
    parseFloat(stock.Change) || 0,
    score.total
  );

  addAnalysisMsg(stock, pb, score, prevRecords);
}

// ── Enter 送出 ──
document.getElementById('stock-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSearch();
});

// ── 清除對話 ──
function clearChat() {
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `
    <div id="empty-state">
      <div class="big">📈</div>
      <p>輸入股票代號或名稱開始查詢</p>
      <p style="font-size:12px;">例：2330、台積電、2542</p>
    </div>`;
}

// ── 初始化 ──
renderSidebar();
loadTWSE();
</script>
